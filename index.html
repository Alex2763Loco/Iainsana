<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IA insana - Modo Pro</title>
    <style>
        body { 
            background-color: #111; 
            color: #fff; 
            text-align: center; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            overflow: hidden; 
        }
        canvas { 
            background-color: #1a1a20; 
            border: 5px solid #444; 
            display: block; 
            margin: 15px auto; 
            box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.5); 
        }
        h1 { margin-top: 10px; color: #ff3333; }
        
        /* Controles táctiles ordenados */
        #panel-controles { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .fila-btn { display: flex; gap: 20px; }
        .boton-juego { 
            width: 75px; 
            height: 75px; 
            font-size: 30px; 
            background: #333; 
            border: 3px solid #666; 
            color: white; 
            border-radius: 15px; 
            touch-action: manipulation;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>La IA te ama w</h1>
    <canvas id="juego" width="800" height="400"></canvas>

    <div id="panel-controles">
        <button id="arriba" class="boton-juego">⬆️</button>
        <div class="fila-btn">
            <button id="izquierda" class="boton-juego">⬅️</button>
            <button id="abajo" class="boton-juego">⬇️</button>
            <button id="derecha" class="boton-juego">➡️</button>
        </div>
    </div>

    <script>
        // Configuración inicial del motor de juego
        const canvas = document.getElementById("juego");
        const ctx = canvas.getContext("2d");
        
        let jugador = { x: 100, y: 200, w: 30, h: 30, vel: 6 };
        let ia = { x: 700, y: 200, w: 40, h: 50, vel: 2.5 };
        let teclas = {};

        // Escuchar teclado
        window.addEventListener("keydown", (e) => teclas[e.key] = true);
        window.addEventListener("keyup", (e) => teclas[e.key] = false);

        // Configurar botones táctiles
        function vincularBoton(id, nombreTecla) {
            const btn = document.getElementById(id);
            btn.onpointerdown = () => teclas[nombreTecla] = true;
            btn.onpointerup = () => teclas[nombreTecla] = false;
        }
        
        vincularBoton("arriba", "ArrowUp");
        vincularBoton("abajo", "ArrowDown");
        vincularBoton("izquierda", "ArrowLeft");
        vincularBoton("derecha", "ArrowRight");

        // Bucle principal (Game Loop)
        function loop() {
            // Movimiento del jugador
            if ((teclas["ArrowUp"] || teclas["w"]) && jugador.y > 0) jugador.y -= jugador.vel;
            if ((teclas["ArrowDown"] || teclas["s"]) && jugador.y < canvas.height - jugador.h) jugador.y += jugador.vel;
            if ((teclas["ArrowLeft"] || teclas["a"]) && jugador.x > 0) jugador.x -= jugador.vel;
            if ((teclas["ArrowRight"] || teclas["d"]) && jugador.x < canvas.width - jugador.w) jugador.x += jugador.vel;

            // Inteligencia artificial (seguimiento suave)
            ia.x += (jugador.x - ia.x) * 0.03;
            ia.y += (jugador.y - ia.y) * 0.03;

            // Limpiar pantalla
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar al jugador (Oficinista)
            ctx.fillStyle = "#3498db";
            ctx.fillRect(jugador.x, jugador.y, jugador.w, jugador.h);

            // Dibujar a la IA (La solicitud)
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(ia.x, ia.y, ia.w, ia.h);
            
            // Detalles de la solicitud
            ctx.fillStyle = "red";
            ctx.font = "12px Arial";
            ctx.fillText("JOB", ia.x + 8, ia.y + 25);

            requestAnimationFrame(loop);
        }

        // Iniciar
        loop();

        // ESPACIO PARA AGREGAR NUEVAS FUNCIONES MÁS ADELANTE...
        // Aquí puedes poner tu contador de puntos, niveles de dificultad,
        // pantallas de Game Over, o cualquier otra locura que se te ocurra.
        // Tener más líneas te da libertad para crear cosas épicas sin romper nada.

    </script>
</body>
</html>
